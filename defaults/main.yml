---
#
# Defaults
#

# System baseline
fix_root_pv: false
kernel_sysctl_settings:
  - { param: "net.ipv4.tcp_keepalive_time", value: "300" }
  - { param: "net.ipv4.tcp_keepalive_intvl", value: "30" }
dnf_installonly_limit: 2
networkmanager_wait_device_timeout: 10
timezone: ""
dns_domain_search: ""
selinux_config: ""
sudoers_group: ""
mail_relay: ""
etc_motd_content: |+
  #############################################################################
      Welcome to {{ ansible_nodename }} ({{ ansible_default_ipv4.address }})
  #############################################################################
profile_inputrc_content: |+
  set editing-mode vi
profile_digrc_content: |+
  +search +short
#
# Packages, repositories, and updates
packages_installed_common: []
packages_installed_bespoke: []
packages_installed: >-
  {{
    (packages_installed_common | default([], true))
    + (packages_installed_bespoke | default([], true))
  }}
packages_uninstalled_common: []
packages_uninstalled_bespoke: []
packages_uninstalled: >-
  {{
    (packages_uninstalled_common | default([], true))
    + (packages_uninstalled_bespoke | default([], true))
  }}
packages_rpm: []
packages_rpm_artifact_src: "{{ artifacts_root }}/rpms"
packages_rpm_remote_cache: "/var/cache/infra-core/rpms"
dnf_automatic: {}
repos_enabled: {}
dnf_conf_excludepkgs: []

# Accounts and access
local_groups_enforce_gid: false
local_groups: {}
group_members: {}
local_accounts: {}

# Storage, filesystems, paths, and ACLs
volume_groups: {}
local_mounts: {}
network_mounts: {}
nfs_exports: {}
local_path_sets: {}
local_paths: {}
paths_absent_common:
  - "/etc/motd.d/cockpit"
  - "/etc/motd.d/insights-client"
paths_absent_bespoke: []
paths_absent: >-
  {{
    (paths_absent_common | default([], true))
    + (paths_absent_bespoke | default([], true))
  }}
local_acls: []

# Profiles and MOTD
profile_managed_files_common:
  [
    { user: root, name: ".bashrc", src: files/default_bashrc },
    { user: root, name: ".bash_profile", src: files/default_bash_profile },
    { user: root, name: ".inputrc", content: "{{ profile_inputrc_content }}" },
    { user: root, name: ".digrc", content: "{{ profile_digrc_content }}" },
  ]
profile_managed_files_bespoke: []
profile_managed_files: >-
  {{
    (profile_managed_files_common | default([], true))
    + (profile_managed_files_bespoke | default([], true))
  }}
crontab_entries: {}

# Artifacts and deployed files
artifact_notify_map_default:
  update_ca_trust: "Update CA Trust"
  systemd_daemon_reload: "Systemd daemon-reload"
  reload_firewalld: "Reload firewalld"
  reload_nfs_exports: "Reload NFS exports"
  restart_networkmanager: "Restart NetworkManager"
  restart_postfix: "Restart Postfix"
  restart_rsyslog: "Restart rsyslog"
  restart_autofs: "Restart autofs"
  restart_sssd: "Restart sssd"
  restart_httpd: "Restart httpd"
  restart_nginx: "Restart nginx"
  restart_crond: "Restart crond"
  restart_sshd: "Restart sshd"
artifact_notify_map: {}
artifact_notify_map_merged: >-
  {{
    (artifact_notify_map_default | default({}, true))
    | combine(artifact_notify_map | default({}, true), recursive=true)
  }}
artifacts_root: "{{ inventory_dir }}/artifacts"
artifacts_pre: [] # bootstrap/prereq artifacts that must run before packages
artifacts_pre_merged: "{{ artifacts_pre | default([], true) }}"
artifacts_common: [] # shared everywhere
artifacts_env: [] # from group_vars/<env>.yml
artifacts_role: [] # from group_vars/<role>.yml
artifacts_host: [] # from host_vars/<host>.yml
artifacts_merged: >-
  {{
    (artifacts_common | default([]))
    + (artifacts_env   | default([]))
    + (artifacts_role  | default([]))
    + (artifacts_host  | default([]))
  }}

# Services and firewall
services_enabled: []
services_disabled: []
firewall_allow_ports: []
firewall_enable_services: []
