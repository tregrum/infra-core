---

- name: Parse System Class
  ansible.builtin.set_fact:
    host_class: >-
      {{
        (
          (ansible_virtualization_role | default('') == 'guest')
          | ternary(
              ansible_virtualization_type | default(ansible_product_name.split()[0], true),
              ansible_product_name.split()[0]
            )
        )
        | lower
        | regex_replace('^kvm$', 'qemu')
      }}

- name: Fix Missing Domain | ifcfg_interface search
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/network-scripts/ifcfg-{{ ansible_default_ipv4.interface }}
    regexp: '^DOMAIN='
    line: 'DOMAIN={{ dns_domain_search }}'
    backup: true
  when:
    - host_class == "vmware"
    - dns_domain_search is defined
    - dns_domain_search | string | trim | length > 0
  notify: Restart NetworkManager

- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ timezone }}"
  when:
    - timezone is defined
    - timezone | string | trim | length > 0
