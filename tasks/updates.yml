---

- name: Set the max kernel count
  ansible.builtin.lineinfile:
    path: "/etc/dnf/dnf.conf"
    regexp: "^installonly_limit="
    line: "installonly_limit={{ dnf_installonly_limit }}"
  when: dnf_installonly_limit is defined

- name: DNF | Configure excluded packages
  ansible.builtin.lineinfile:
    path: "/etc/dnf/dnf.conf"
    regexp: "^excludepkgs="
    line: >-
      excludepkgs={{
        dnf_conf_excludepkgs
        if dnf_conf_excludepkgs is string
        else dnf_conf_excludepkgs | join(',')
      }}
  when:
    - dnf_conf_excludepkgs | default([], true) | length > 0

- name: Enable Automated DNF Updates
  when:
    - dnf_automatic.install | default(false) | bool
  block:
    - name: Validate dnfauto reboot mode
      ansible.builtin.assert:
        that:
          - dnf_automatic.reboot is not defined or dnf_automatic.reboot in ['never', 'when-changed', 'when-needed']
        fail_msg: "dnf_automatic.reboot must be one of: never, when-changed, when-needed"

    - name: Validate dnfauto base excludes
      ansible.builtin.assert:
        that:
          - >-
            dnf_automatic.excludepkgs is not defined
            or dnf_automatic.excludepkgs is string
            or (dnf_automatic.excludepkgs is sequence and dnf_automatic.excludepkgs is not string)
        fail_msg: >-
          dnf_automatic.excludepkgs must be a string or a list of package name
          patterns when set.

    - name: DNF | install packages
      ansible.builtin.dnf:
        name: "dnf-automatic"
        state: present

    - name: Enable dnfauto downloads
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^download_updates"
        line: "download_updates = yes"

    - name: Enable dnfauto updates
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^apply_updates"
        line: "apply_updates = yes"

    - name: Configure dnfauto reboots
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^(#\\s*)?reboot\\s*="
        line: "reboot = {{ dnf_automatic.reboot | default('never') }}"

    - name: Configure dnfauto excludes
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^excludepkgs="
        line: "excludepkgs={{ dnf_automatic.excludepkgs | join(',') }}"
      when:
        - dnf_automatic.excludepkgs | default([], true) | length > 0

    - name: Remove dnfauto excludes
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^excludepkgs="
        state: absent
      when:
        - dnf_automatic.excludepkgs | default([], true) | length == 0

    - name: Configure DNF Timer Scheduler
      ansible.builtin.template:
        src: "dnf-automatic.timer.j2"
        dest: "/etc/systemd/system/dnf-automatic.timer"
        owner: "root"
        group: "root"
        mode: "0744"

    - name: Enable Timer dnf-automatic
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        state: started
        enabled: true
#
