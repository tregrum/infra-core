# tasks/artifacts.yml
# Generic, data-driven artifact deployment.
#

- name: Artifacts | validate copy_set definitions
  ansible.builtin.assert:
    that:
      - item.src_dir is defined
      - item.src_dir | string | trim | length > 0
      - item.dest_dir is defined
      - item.dest_dir | string | trim | length > 0
      - (item.dest_dir | string) is match('^/')
      - item.files is defined
      - item.files is sequence
      - item.files is not string
      - item.files | length > 0
      - >-
        (
          item.files
          | select('string')
          | map('trim')
          | reject('equalto', '')
          | reject('match', '^/')
          | reject('search', '\\.\\.')
          | list
          | length
        ) == (item.files | length)
    fail_msg: >-
      copy_set '{{ item.name | default(item.dest_dir) }}' must define non-empty
      src_dir, absolute dest_dir, and a non-empty list of relative file names.
  loop: "{{ artifacts_merged | selectattr('type', 'equalto', 'copy_set') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest_dir) }}" }

- name: Artifacts | validate copy_tree definitions
  ansible.builtin.assert:
    that:
      - item.src_dir is defined
      - item.src_dir | string | trim | length > 0
      - item.dest_dir is defined
      - item.dest_dir | string | trim | length > 0
      - (item.dest_dir | string) is match('^/')
      - item.src_dir | string | trim is not match('^/')
      - item.src_dir | string | trim is not search('\\.\\.')
      - item.mode is not defined or (item.mode | string | trim | length > 0)
      - item.dir_mode is not defined or (item.dir_mode | string | trim | length > 0)
    fail_msg: >-
      copy_tree '{{ item.name | default(item.dest_dir) }}' must define a
      relative src_dir, an absolute dest_dir, and optional non-empty mode and
      dir_mode values.
  loop: "{{ artifacts_merged | selectattr('type', 'equalto', 'copy_tree') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest_dir) }}" }

- name: Artifacts | initialize normalized items
  ansible.builtin.set_fact:
    artifacts_normalized: >-
      {{
        artifacts_merged
        | rejectattr('type', 'equalto', 'copy_set')
        | rejectattr('type', 'equalto', 'copy_tree')
        | list
      }}

- name: Artifacts | append expanded copy_set entries
  ansible.builtin.set_fact:
    artifacts_normalized: "{{ artifacts_normalized + expanded_items }}"
  loop: "{{ artifacts_merged | selectattr('type', 'equalto', 'copy_set') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest_dir) }}" }
  vars:
    expanded_items: >-
      {%- set out = [] -%}
      {%- set src_prefix = item.src_dir | regex_replace('/+$', '') -%}
      {%- set dest_prefix = item.dest_dir | regex_replace('/+$', '') -%}
      {%- for filename in item.files | map('trim') -%}
      {%- set _ = out.append({
          'type': 'copy',
          'name': (item.name | default(dest_prefix)) ~ ' :: ' ~ filename,
          'src': src_prefix ~ '/' ~ filename,
          'dest': dest_prefix ~ '/' ~ filename,
          'owner': item.owner | default('root'),
          'group': item.group | default('root'),
          'mode': item.mode | default('0644')
        }) -%}
      {%- endfor -%}
      {{ out | to_json | from_json }}

# ---- PARENT DIRS (copy/template only) ----
- name: Ensure parent directories exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ artifacts_normalized | selectattr('type', 'in', ['copy', 'template']) | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }

# ---- COPY (from file path) ----
- name: Deploy artifacts (copy files)
  ansible.builtin.copy:
    src: >-
      {{
        lookup('ansible.builtin.first_found', {
          'files': [item.src],
          'paths': [artifacts_root, artifacts_root ~ '/files']
        })
      }}
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    backup: false
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'copy') | rejectattr('content', 'defined') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }
  register: artifacts_copy

# ---- COPY (inline content) ----
- name: Deploy artifacts (copy inline content)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    backup: false
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'copy') | selectattr('content', 'defined') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }
  register: artifacts_copy_inline

# ---- TEMPLATE ----
- name: Deploy artifacts (template)
  ansible.builtin.template:
    src: "{{ artifacts_root }}/templates/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    backup: false
    validate: "{{ item.validate | default(omit) }}"
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'template') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }
  register: artifacts_template

# ---- DIRECTORY ----
- name: Ensure directories
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'directory') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }

# ---- COPY TREE ----
- name: Deploy artifact trees
  ansible.builtin.copy:
    src: >-
      {{
        lookup('ansible.builtin.first_found', {
          'files': [item.src_dir | regex_replace('/+$', '')],
          'paths': [artifacts_root, artifacts_root ~ '/files']
        })
      }}
    dest: "{{ item.dest_dir | regex_replace('/+$', '') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default(omit) }}"
    directory_mode: "{{ item.dir_mode | default('0755') }}"
    backup: false
  loop: "{{ artifacts_merged | selectattr('type', 'equalto', 'copy_tree') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest_dir) }}" }
  register: artifacts_copy_tree

# ---- SYMLINK ----
- name: Create symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'link') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }

# ---- OPTIONAL: SYNC (rsync) ----
- name: Sync artifact trees (optional)
  ansible.posix.synchronize:
    src: "{{ artifacts_root }}/sync/{{ item.src_dir }}/"
    dest: "{{ item.dest | regex_replace('/+$', '') }}/"
    archive: true
    delete: "{{ item.delete | default(false) }}"
    compress: true
    rsync_opts: "{{ item.rsync_opts | default([]) }}"
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'sync') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }
  register: artifacts_sync
  when: (artifacts_normalized | selectattr('type', 'equalto', 'sync') | list | length) > 0

# ---- OPTIONAL: ARCHIVE (tar extract) ----
- name: Extract archives (optional)
  ansible.builtin.unarchive:
    src: "{{ artifacts_root }}/archives/{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: false
    extra_opts: >-
      {{
        []
        + (['--strip-components=' ~ (item.strip | int)] if item.strip is defined else [])
        + (item.include | default([]) | map('regex_replace','^(.*)$','--include=\\1') | list)
        + (item.exclude | default([]) | map('regex_replace','^(.*)$','--exclude=\\1') | list)
      }}
  loop: "{{ artifacts_normalized | selectattr('type', 'equalto', 'archive') | list }}"
  loop_control: { label: "{{ item.name | default(item.dest) }}" }
  register: artifacts_archive
  when: (artifacts_normalized | selectattr('type', 'equalto', 'archive') | list | length) > 0

# ---- COLLECT CHANGED ITEMS FOR POST-SUMMARY ----
- name: Collect changed artifact items
  ansible.builtin.set_fact:
    _artifacts_changed: >-
      {{
        (
          (artifacts_copy.results        | default([])) +
          (artifacts_copy_inline.results | default([])) +
          (artifacts_template.results    | default([])) +
          (artifacts_copy_tree.results   | default([])) +
          (artifacts_sync.results        | default([])) +
          (artifacts_archive.results     | default([]))
        )
        | selectattr('changed', 'defined') | selectattr('changed')
        | map(attribute='item') | list
      }}
  changed_when: false
