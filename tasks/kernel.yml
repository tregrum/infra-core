---
- name: Network tunables - firewall helper
  ansible.posix.sysctl:
    name: "{{ item.param }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ kernel_sysctl_settings | default([], true) }}"
  when: kernel_sysctl_settings | default([], true) | length > 0

- name: Set the max kernel count
  ansible.builtin.lineinfile:
    path: "/etc/dnf/dnf.conf"
    regexp: "^installonly_limit="
    line: "installonly_limit={{ dnf_installonly_limit }}"
  when: dnf_installonly_limit is defined

- name: DNF | Configure excluded packages
  ansible.builtin.lineinfile:
    path: "/etc/dnf/dnf.conf"
    regexp: "^excludepkgs="
    line: >-
      excludepkgs={{
        dnf_conf_excludepkgs
        if dnf_conf_excludepkgs is string
        else dnf_conf_excludepkgs | join(',')
      }}
  when:
    - dnf_conf_excludepkgs | default([], true) | length > 0

- name: Enable Automated DNF Updates
  when:
    - updates.install | default(false) | bool
  block:
    - name: Validate dnfauto reboot mode
      ansible.builtin.assert:
        that:
          - updates.reboot is not defined or updates.reboot in ['never', 'when-changed', 'when-needed']
        fail_msg: "updates.reboot must be one of: never, when-changed, when-needed"

    - name: DNF | install packages
      ansible.builtin.dnf:
        name: "dnf-automatic"
        state: present

    - name: Enable dnfauto downloads
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^download_updates"
        line: "download_updates = yes"

    - name: Enable dnfauto updates
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^apply_updates"
        line: "apply_updates = yes"

    - name: Configure dnfauto reboots
      ansible.builtin.lineinfile:
        path: "/etc/dnf/automatic.conf"
        regexp: "^(#\\s*)?reboot\\s*="
        line: "reboot = {{ updates.reboot | default('never') }}"

    - name: Configure DNF Timer Scheduler
      ansible.builtin.template:
        src: "dnf-automatic.timer.j2"
        dest: "/etc/systemd/system/dnf-automatic.timer"
        owner: "root"
        group: "root"
        mode: "0744"

    - name: Enable Timer dnf-automatic
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        state: started
        enabled: true

- name: Ensure NetworkManager wait timeout is configured
  become: true
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-wait-timeout.conf
    content: |
      [connection]
      wait-device-timeout={{ networkmanager_wait_device_timeout }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart NetworkManager
  when: networkmanager_wait_device_timeout is defined
#
