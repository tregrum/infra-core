---
- name: MOTD | var defined (content)
  ansible.builtin.copy:
    content: >-
      {{ etc_motd_content | default('') | string }}
    dest: "/etc/motd"
    owner: "root"
    group: "root"
    mode: "0744"
  when: etc_motd_src is not defined

- name: MOTD | var defined (src)
  ansible.builtin.template:
    src: "{{ etc_motd_src }}"
    dest: "/etc/motd"
    owner: "root"
    group: "root"
    mode: "0744"
  when: etc_motd_src is defined

- name: Profile | collect target users
  ansible.builtin.set_fact:
    profile_target_users: >-
      {{
        (
          profile_managed_files
          | default([], true)
          | select('mapping')
          | map(attribute='user', default='root')
          | list
          | unique
        )
      }}

- name: Profile | lookup target user primary groups
  ansible.builtin.command:
    argv:
      - id
      - -gn
      - "{{ item }}"
  loop: "{{ profile_target_users | default([], true) }}"
  register: profile_target_user_groups_lookup
  changed_when: false
  failed_when: false

- name: Profile | derive target user primary groups
  ansible.builtin.set_fact:
    profile_target_user_groups: >-
      {{
        (profile_target_user_groups | default({}))
        | combine({
            item.item: (item.stdout | trim)
          })
      }}
  loop: "{{ profile_target_user_groups_lookup.results | default([], true) }}"
  when:
    - item.rc is defined
    - item.rc == 0
    - item.stdout is defined
    - item.stdout | trim | length > 0

- name: Profile | managed files
  ansible.builtin.copy:
    content: >-
      {{
        (item.src is defined)
        | ternary(omit, (item.content | default('') | string))
      }}
    src: "{{ item.src | default(omit) }}"
    dest: >-
      {{
        item.dest
        | default('~' ~ (item.user | default('root')) ~ '/' ~ ((item.name | default('') | regex_replace('^/+',''))))
      }}
    owner: "{{ item.owner | default(item.user | default('root')) }}"
    group: >-
      {{
        item.group
        | default(
            item.owner
            | default(
                (profile_target_user_groups | default({}))[item.user | default('root')]
                | default(item.user | default('root'))
              )
          )
      }}
    mode: "{{ item.mode | default('0644') }}"
    backup: "{{ item.backup | default(false) }}"
  loop: "{{ profile_managed_files | default([]) }}"
  loop_control:
    label: >-
      {{ item.dest | default('~' ~ (item.user | default('root')) ~ '/' ~ (item.name | default(''))) }}
  when: item is mapping and (item.dest is defined or item.name is defined)
#
