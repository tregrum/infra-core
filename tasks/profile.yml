---
- name: MOTD | var defined (content)
  ansible.builtin.copy:
    content: >-
      {{ etc_motd_content | default('') | string }}
    dest: "/etc/motd"
    owner: "root"
    group: "root"
    mode: "0744"
  when: etc_motd_src is not defined

- name: MOTD | var defined (src)
  ansible.builtin.template:
    src: "{{ etc_motd_src }}"
    dest: "/etc/motd"
    owner: "root"
    group: "root"
    mode: "0744"
  when: etc_motd_src is defined

- name: Paths | validate absent targets
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - item is match('^/')
      - item not in ['/', '/etc', '/var', '/usr', '/home', '/root', '/opt', '/srv']
    fail_msg: >-
      paths_absent entries must be non-empty absolute file paths and may not
      target high-risk root directories.
  loop: "{{ paths_absent_merged | default([], true) }}"

- name: Paths | stat absent targets
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ paths_absent_merged | default([], true) }}"
  register: paths_absent_stat

- name: Paths | reject existing directories from absent list
  ansible.builtin.assert:
    that:
      - not (paths_absent_stat.results[ansible_loop.index0].stat.exists | default(false))
        or not (paths_absent_stat.results[ansible_loop.index0].stat.isdir | default(false))
    fail_msg: >-
      paths_absent target '{{ item }}' currently exists as a directory. This
      list is intended for file targets only.
  loop: "{{ paths_absent_merged | default([], true) }}"
  loop_control:
    extended: true

- name: Paths | remove absent targets
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ paths_absent_merged | default([], true) }}"

- name: Cron | install entries
  ansible.builtin.copy:
    content: "{{ (item.value | string | trim) + '\n' }}"
    dest: "/etc/cron.d/{{ item.key }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ crontab_entries | default({}, true) | dict2items }}"
  when: item.value is defined and (item.value | string | trim | length > 0)

- name: Profile | managed files
  ansible.builtin.copy:
    content: >-
      {{
        (item.src is defined)
        | ternary(omit, (item.content | default('') | string))
      }}
    src: "{{ item.src | default(omit) }}"
    dest: >-
      {{
        item.dest
        | default('~' ~ (item.user | default('root')) ~ '/' ~ ((item.name | default('') | regex_replace('^/+',''))))
      }}
    owner: "{{ item.owner | default(item.user | default('root')) }}"
    group: "{{ item.group | default(item.owner | default(item.user | default('root'))) }}"
    mode: "{{ item.mode | default('0644') }}"
    backup: "{{ item.backup | default(false) }}"
  loop: "{{ profile_managed_files | default([]) }}"
  loop_control:
    label: >-
      {{ item.dest | default('~' ~ (item.user | default('root')) ~ '/' ~ (item.name | default(''))) }}
  when: item is mapping and (item.dest is defined or item.name is defined)
#
